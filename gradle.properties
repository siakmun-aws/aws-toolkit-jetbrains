# Toolkit Version
toolkitVersion=3.57-SNAPSHOT

# Publish Settings
publishToken=
publishChannel=

ideProfileName=2024.3

remoteRobotPort=8080

# Code style
kotlin.code.style=official

# Gradle settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m
kotlin.daemon.jvmargs=-Xmx2048m

# prefer non-enterprise variant of test-retry
systemProp.develocity.testretry.enabled=false

# outputs to build/reports/kotlin-build
kotlin.build.report.output=file

# don't bundle Kotlin stdlib with plugin
kotlin.stdlib.default.dependency=false

# Disable automatic Kotlin test dependency capability management to prevent circular dependencies
# This fixes StackOverflowError in DefaultConfiguration.initAllDependencies() caused by
# KotlinTestDependencyManagementKt.maybeAddTestDependencyCapability with custom test configurations
# See: https://youtrack.jetbrains.com/issue/KT-57490
kotlin.test.infer.jvm.variant=false
